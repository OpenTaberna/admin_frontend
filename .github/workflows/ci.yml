name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Licence
        run: |
          node -e '
            const fs = require("fs");
            const { license } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (license !== "Apache-2.0") throw new Error(`package.json license is ${license}`);
            if (!/Apache License\s+Version 2\.0/.test(fs.readFileSync("LICENSE", "utf8"))) throw new Error("LICENSE is not Apache-2.0");
          '

      - name: Community files
        run: test -f CODE_OF_CONDUCT.md && test -f CONTRIBUTING.md && test -f .github/CODEOWNERS

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build --configuration production
